name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BANK_MODEL_MODE: demo
      BANK_MEMORY_EMBEDDING: lexical
      BANK_SCHEDULER_MODE: external
      BANK_TEST_LIVE_MODEL: '0'
      BANK_TEST_EMBEDDING: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check bank_agent evaluation tests
      - run: python -m pytest
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
